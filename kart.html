<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kartvizit</title>
<meta name="theme-color" content="#071a3a">
<style>
:root{--bg:#071a3a;--card:#0f2550;--line:rgba(255,255,255,.12);--fg:#f2f6fc;--mut:#a9b8d3;--blue:#2f7bff;--green:#25d366}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(900px 500px at 70% -10%,#12408a,transparent 60%),var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px 18px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.av{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#2f7bff,#0b2a5b);font-weight:800;font-size:30px;line-height:1;letter-spacing:1px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.t{color:var(--mut);margin-top:2px}
.co{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfdcf2}
.acts{display:grid;gap:10px;margin-top:22px}
.b{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;text-align:left}
.b:hover{background:rgba(255,255,255,.1)}
.b svg{width:22px;height:22px;flex:none}
.b span{display:block}.b small{display:block;font-weight:500;color:var(--mut);font-size:13px;word-break:break-all}
.b.call{background:var(--blue);border-color:transparent}.b.call small{color:#dbe8ff}
.b.wa{background:var(--green);border-color:transparent;color:#05300f}.b.wa small{color:#0b4d1d}
.save{margin-top:14px;width:100%;padding:12px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--fg);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.ft{margin-top:16px;font-size:12px;color:var(--mut)}.ft a{color:#cfdcf2;font-weight:800;letter-spacing:.08em;text-decoration:none}
.err{color:var(--mut)}
</style>
</head>
<body>
<main class="card" id="card"><p class="err">Kartvizit bilgisi bulunamadı.</p></main>
<script>
(function(){
  function dec(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))));}catch(e){return null;}}
  var h=location.hash.replace(/^#/,""), d=dec(h); if(!d) return;
  var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
  var digits=function(p){var s=String(p||"").replace(/[^0-9+]/g,"");if(s.indexOf("+")!==0&&s.indexOf("0")===0)s="+90"+s.slice(1);return s;};
  var web=String(d.w||"").trim(); if(web&&!/^https?:\/\//i.test(web)) web="https://"+web;
  var ico={call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
    web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>'};
  var card=document.getElementById("card"); card.innerHTML="";
  var ini=(d.n||d.c||"?").trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0);}).join("").toLocaleUpperCase("tr");
  card.appendChild(el("div","av",ini));
  card.appendChild(el("h1",null,d.n||d.c||""));
  if(d.t) card.appendChild(el("div","t",d.t));
  if(d.c) card.appendChild(el("div","co",d.c));
  document.title=(d.n||"Kartvizit")+(d.c?" · "+d.c:"");
  var acts=el("div","acts");
  function btn(cls,href,title,sub,icon){var a=el("a","b "+cls);a.href=href;if(/^https?:/.test(href)){a.target="_blank";a.rel="noopener";}a.innerHTML=ico[icon];var w=el("div");w.appendChild(el("span",null,title));if(sub)w.appendChild(el("small",null,sub));a.appendChild(w);acts.appendChild(a);}
  if(d.p) btn("call","tel:"+digits(d.p),"Ara",d.p,"call");
  var wa=digits(d.wa||d.p).replace("+",""); if(wa) btn("wa","https://wa.me/"+wa,"WhatsApp'tan yaz",d.wa||d.p,"wa");
  if(web) btn("web",web,"Web sitesi",web.replace(/^https?:\/\//,""),"web");
  if(d.e) btn("mail","mailto:"+d.e,"E-posta gönder",d.e,"mail");
  card.appendChild(acts);
  var sv=el("button","save","Rehbere kaydet"); sv.type="button";
  sv.onclick=function(){var esc=function(s){return String(s||"").replace(/[\\,;]/g,function(m){return "\\"+m;});};
    var v=["BEGIN:VCARD","VERSION:3.0","FN:"+esc(d.n),"N:"+esc(d.n)+";;;;"];
    if(d.c)v.push("ORG:"+esc(d.c)); if(d.t)v.push("TITLE:"+esc(d.t)); if(d.p)v.push("TEL;TYPE=CELL:"+digits(d.p)); if(d.e)v.push("EMAIL:"+d.e); if(web)v.push("URL:"+web); v.push("END:VCARD");
    var blob=new Blob([v.join("\r\n")],{type:"text/vcard"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(d.n||"kartvizit").replace(/[^\wçğıöşüÇĞİÖŞÜ ]+/g,"")+".vcf";document.body.appendChild(a);a.click();a.remove();};
  card.appendChild(sv);
  var ft=el("div","ft"); ft.innerHTML='<a href="https://saqol.net" target="_blank" rel="noopener">SAQOL</a> ile gönderildi'; card.appendChild(ft);
})();
</script>
</body>
</html>
